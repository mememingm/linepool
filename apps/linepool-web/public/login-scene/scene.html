<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>LINEPOOL WebGL background</title>
    <style>
      html,
      body,
      .l-page {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #111;
      }

      #canvas-webgl {
        position: fixed;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
      }

      .js-contents,
      .js-dummy-scroll {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div class="l-page" data-id="index">
      <div class="js-contents"></div>
      <div class="js-dummy-scroll"></div>
      <canvas id="canvas-webgl"></canvas>
    </div>
    <script>
      window.__SOULECHO_HERO_CONFIG__ = {
        titleTexture: 'data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%221%22%20height%3D%221%22%3E%3C%2Fsvg%3E'
      }

      function startSceneWhenSized() {
        if (!document.body.clientWidth || !window.innerHeight) {
          window.requestAnimationFrame(startSceneWhenSized)
          return
        }

        var runtime = document.createElement('script')
        runtime.src = './runtime.js'
        document.body.appendChild(runtime)
      }

      window.requestAnimationFrame(startSceneWhenSized)
    </script>
  </body>
</html>
